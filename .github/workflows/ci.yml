name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run code quality check
        run: |
          pip install flake8
          flake8 src/ --max-line-length=120 --ignore=E402,W503,E221,E241,E501,E302,E301,F401,W293

      - name: Run tests
        run: python tests/test_core.py